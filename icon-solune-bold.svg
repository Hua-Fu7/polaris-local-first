<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="crescent">
      <circle cx="0" cy="0" r="70" fill="#fff"/>
      <circle cx="-26" cy="-11" r="61" fill="#000"/>
    </mask>
    <linearGradient id="flameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="-126" x2="0" y2="-325">
      <stop offset="0" stop-color="#F3E6C8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F3E6C8" stop-opacity="1"/>
    </linearGradient>
    <g id="flame" fill="none" stroke="url(#flameGrad)" stroke-width="6" stroke-linecap="round">
      <path d="M -20,-126 C -46,-190 22,-232 -14,-325"/>
      <path d="M 14,-126 C -6,-192 42,-236 -14,-325"/>
    </g>
    <line id="dotray" x1="0" y1="-128" x2="0" y2="-300" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 17"/>
    <g id="axis" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <circle cx="0" cy="-128" r="7" stroke="none"/>
      <line x1="0" y1="-160" x2="0" y2="-225"/>
      <line x1="0" y1="-240" x2="0" y2="-300"/>
      <circle cx="0" cy="-335" r="14" stroke="none"/>
      <circle cx="0" cy="-365" r="7" stroke="none"/>
    </g>
  </defs>

  <g transform="translate(500 500) scale(__GLYPH_SCALE__)" color="#F3E6C8" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="currentColor" mask="url(#crescent)"/>
    <circle cx="0" cy="0" r="104" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 18"/>

    <use href="#axis"/>
    <use href="#axis" transform="rotate(90)"/>
    <use href="#axis" transform="rotate(180)"/>
    <use href="#axis" transform="rotate(270)"/>

    <use href="#dotray" transform="rotate(30)"/>
    <use href="#dotray" transform="rotate(60)"/>
    <use href="#dotray" transform="rotate(120)"/>
    <use href="#dotray" transform="rotate(150)"/>
    <use href="#dotray" transform="rotate(210)"/>
    <use href="#dotray" transform="rotate(240)"/>
    <use href="#dotray" transform="rotate(300)"/>
    <use href="#dotray" transform="rotate(330)"/>

    <use href="#flame" transform="rotate(15)"/>
    <use href="#flame" transform="rotate(-15)"/>
    <use href="#flame" transform="rotate(45)"/>
    <use href="#flame" transform="rotate(75)"/>
    <use href="#flame" transform="rotate(105)"/>
    <use href="#flame" transform="rotate(135)"/>
    <use href="#flame" transform="rotate(165)"/>
    <use href="#flame" transform="rotate(195)"/>
    <use href="#flame" transform="rotate(225)"/>
    <use href="#flame" transform="rotate(255)"/>
    <use href="#flame" transform="rotate(285)"/>
    <use href="#flame" transform="rotate(315)"/>
  </g>
</svg>
